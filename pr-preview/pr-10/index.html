      // Google Analytics is never loaded until the user explicitly accepts via the consent
      // banner below; declining (or leaving the choice unset) never touches gtag.js or any GA

      var GA_MEASUREMENT_ID = "G-B6RE9KX9M5";
      var ANALYTICS_CONSENT_KEY = "hearth-landing-page.analytics-consent";

      function getAnalyticsConsent() {
        try {
          return localStorage.getItem(ANALYTICS_CONSENT_KEY);
        } catch (e) {
          return null;
        }
      }

      function setAnalyticsConsent(value) {
        try {
          localStorage.setItem(ANALYTICS_CONSENT_KEY, value);
        } catch (e) {}
      }

      function loadGoogleAnalytics() {
        if (window.gtag) return;

        window.dataLayer = window.dataLayer || [];
        function gtag() {
          window.dataLayer.push(arguments);
        }
        window.gtag = gtag;
        window.gtag("js", new Date());
        window.gtag("config", GA_MEASUREMENT_ID);

        var gtagScript = document.createElement("script");
        gtagScript.async = true;
        gtagScript.src =
          "https://www.googletagmanager.com/gtag/js?id=" + GA_MEASUREMENT_ID;
        document.head.appendChild(gtagScript);
      }

      document.addEventListener("DOMContentLoaded", function () {
        var banner = document.getElementById("analytics-consent-banner");
        var acceptBtn = document.getElementById("analytics-accept-btn");
        var declineBtn = document.getElementById("analytics-decline-btn");
        if (!banner || !acceptBtn || !declineBtn) return;

        var consent = getAnalyticsConsent();
        if (consent === "accepted") {
          loadGoogleAnalytics();
          banner.hidden = true;
        } else if (consent === "declined") {
          banner.hidden = true;
        } else {
          banner.hidden = false;
        }

        acceptBtn.addEventListener("click", function () {
          setAnalyticsConsent("accepted");
          loadGoogleAnalytics();
          banner.hidden = true;
        });

        declineBtn.addEventListener("click", function () {
          setAnalyticsConsent("declined");
          banner.hidden = true;
        });
      });
    </script>
