<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEARTH — Apps</title>
    <meta
      name="description"
      content="The HEARTH data ecosystem — a hub linking to the HEARTH suite of apps."
    />
    <link rel="icon" href="/pr-preview/pr-14/assets/favicon-B90oisb9.ico" sizes="any" />
    <link rel="icon" href="/pr-preview/pr-14/assets/hearth-mark-DWWES0np.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pr-preview/pr-14/assets/apple-touch-icon-C_MGaaDV.png" />
    <script>
      // Google Analytics is never loaded until the user explicitly accepts via the consent
      // banner below; declining (or leaving the choice unset) never touches gtag.js or any GA
      // cookie. Consent is re-checked on every page load from this localStorage key.
      var GA_MEASUREMENT_ID = "G-B6RE9KX9M5";
      var ANALYTICS_CONSENT_KEY = "hearth-landing-page.analytics-consent";

      function getAnalyticsConsent() {
        try {
          return localStorage.getItem(ANALYTICS_CONSENT_KEY);
        } catch (e) {
          return null;
        }
      }

      function setAnalyticsConsent(value) {
        try {
          localStorage.setItem(ANALYTICS_CONSENT_KEY, value);
        } catch (e) {}
      }

      function loadGoogleAnalytics() {
        if (window.gtag) return;

        window.dataLayer = window.dataLayer || [];
        function gtag() {
          window.dataLayer.push(arguments);
        }
        window.gtag = gtag;
        window.gtag("js", new Date());
        window.gtag("config", GA_MEASUREMENT_ID);

        var gtagScript = document.createElement("script");
        gtagScript.async = true;
        gtagScript.src =
          "https://www.googletagmanager.com/gtag/js?id=" + GA_MEASUREMENT_ID;
        document.head.appendChild(gtagScript);
      }

      document.addEventListener("DOMContentLoaded", function () {
        var banner = document.getElementById("analytics-consent-banner");
        var acceptBtn = document.getElementById("analytics-accept-btn");
        var declineBtn = document.getElementById("analytics-decline-btn");
        if (!banner || !acceptBtn || !declineBtn) return;

        var consent = getAnalyticsConsent();
        if (consent === "accepted") {
          loadGoogleAnalytics();
          banner.hidden = true;
        } else if (consent === "declined") {
          banner.hidden = true;
        } else {
          banner.hidden = false;
        }

        acceptBtn.addEventListener("click", function () {
          setAnalyticsConsent("accepted");
          loadGoogleAnalytics();
          banner.hidden = true;
        });

        declineBtn.addEventListener("click", function () {
          setAnalyticsConsent("declined");
          banner.hidden = true;
        });
      });
    </script>
    <script type="module" crossorigin src="/pr-preview/pr-14/assets/index-FdT9pskD.js"></script>
    <link rel="stylesheet" crossorigin href="/pr-preview/pr-14/assets/index-BgdkqBRa.css">
  </head>
  <body>
    <main class="page">
      <header class="header">
        <img class="logo" src="/pr-preview/pr-14/assets/hearth-logo-Bvdr4fVl.svg" alt="HEARTH" />
        <p class="tagline">
          Hub for Exploratory Analysis, Resource-sharing, Testing, and
          Hypothesis-generation
        </p>
        <p class="subtext">Pick an app below to get started.</p>
      </header>
      <div id="app-grid" class="app-grid"></div>
    </main>

    <div
      id="analytics-consent-banner"
      class="consent-banner"
      hidden
      role="region"
      aria-label="Analytics consent"
    >
      <p class="consent-banner-text">
        We use analytics tracking to understand how this page is used. No
        tracking is enabled unless you accept.
      </p>
      <div class="consent-banner-actions">
        <button type="button" id="analytics-accept-btn" class="primary">
          Accept
        </button>
        <button type="button" id="analytics-decline-btn">Decline</button>
      </div>
    </div>

  </body>
</html>
